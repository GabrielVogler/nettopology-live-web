<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="800" height="500" fill="#0d1117" rx="10" />
  
  <!-- Definitionen für Schatten und Farben -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge> <feMergeNode /> <feMergeNode in="SourceGraphic" /> </feMerge>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff" />
      <stop offset="100%" style="stop-color:#007bff" />
    </linearGradient>
  </defs>

  <!-- Verbindungslinien -->
  <g stroke="#30363d" stroke-width="2">
    <line x1="400" y1="80" x2="400" y2="180" />
    <line x1="400" y1="220" x2="150" y2="350" />
    <line x1="400" y1="220" x2="400" y2="350" />
    <line x1="400" y1="220" x2="650" y2="350" />
  </g>

  <!-- Cisco Router (Top) -->
  <g transform="translate(365,30)" filter="url(#shadow)">
    <ellipse cx="35" cy="20" rx="35" ry="15" fill="url(#blueGrad)" />
    <rect x="0" y="20" width="70" height="20" fill="#007bff" />
    <ellipse cx="35" cy="40" rx="35" ry="15" fill="#007bff" />
    <text x="35" y="33" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">ROUTER</text>
  </g>

  <!-- Cisco Switch (Middle) -->
  <g transform="translate(360,180)" filter="url(#shadow)">
    <rect width="80" height="40" fill="url(#blueGrad)" rx="2" />
    <path d="M10 10 L30 10 M10 20 L30 20 M10 30 L30 30" stroke="white" stroke-width="2" />
    <path d="M50 10 L70 10 M50 20 L70 20 M50 30 L70 30" stroke="white" stroke-width="2" />
    <text x="40" y="55" font-family="Arial" font-size="10" fill="#8b949e" text-anchor="middle">Catalyst 9k</text>
  </g>

  <!-- PCs (Bottom) -->
  <!-- PC 1 mit Kontextmenü -->
  <g transform="translate(110,350)">
    <rect width="80" height="60" fill="#161b22" stroke="#00e5ff" stroke-width="2" rx="4" />
    <rect x="20" y="10" width="40" height="25" fill="#30363d" />
    <circle cx="70" cy="10" r="4" fill="#39d353" /> <!-- Online Status -->
    <text x="40" y="75" font-family="Arial" font-size="12" fill="#c9d1d9" text-anchor="middle">PC-01</text>
    
    <!-- KONTEXTMENÜ -->
    <g transform="translate(40,20)" filter="url(#shadow)">
      <rect width="120" height="160" fill="#21262d" stroke="#00e5ff" rx="4" />
      <g font-family="Arial" font-size="11" fill="white">
        <text x="10" y="20">SSH</text>
        <text x="10" y="45">RDP</text>
        <line x1="5" y1="55" x2="115" y2="55" stroke="#30363d" />
        <text x="10" y="75" fill="#f85149">Löschen</text>
        <text x="10" y="100">Duplizieren</text>
        <text x="10" y="125">Umbennen</text>
        <line x1="5" y1="135" x2="115" y2="135" stroke="#30363d" />
        <text x="10" y="150">Eigenschaften</text>
      </g>
    </g>
  </g>

  <!-- PC 2 -->
  <g transform="translate(360,350)">
    <rect width="80" height="60" fill="#161b22" stroke="#30363d" rx="4" />
    <rect x="20" y="10" width="40" height="25" fill="#30363d" />
    <circle cx="70" cy="10" r="4" fill="#39d353" />
    <text x="40" y="75" font-family="Arial" font-size="12" fill="#c9d1d9" text-anchor="middle">PC-02</text>
  </g>

  <!-- PC 3 -->
  <g transform="translate(610,350)">
    <rect width="80" height="60" fill="#161b22" stroke="#30363d" rx="4" />
    <rect x="20" y="10" width="40" height="25" fill="#30363d" />
    <circle cx="70" cy="10" r="4" fill="#f85149" /> <!-- Offline Status -->
    <text x="40" y="75" font-family="Arial" font-size="12" fill="#c9d1d9" text-anchor="middle">PC-03</text>
  </g>
</svg>
