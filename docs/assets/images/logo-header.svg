<svg width="250" height="60" viewBox="0 0 250 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund-Definitionen -->
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a2ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bildmarke: Das "Netzwerk-Auge" -->
  <g transform="translate(0,5)">
    <!-- Äußere Augenform -->
    <path d="M10 25 Q25 10 40 25 Q25 40 10 25" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" />
    <!-- Zentraler Knoten (Pupille) -->
    <circle cx="25" cy="25" r="4" fill="#00e5ff" />
    <!-- Verbindungsadern -->
    <line x1="25" y1="25" x2="18" y2="18" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="25" y1="25" x2="32" y2="18" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="25" y1="25" x2="25" y2="35" stroke="#00e5ff" stroke-width="1.5" />
    <!-- Kleine Endknoten -->
    <circle cx="18" cy="18" r="1.5" fill="#c9d1d9" />
    <circle cx="32" cy="18" r="1.5" fill="#c9d1d9" />
    <circle cx="25" cy="35" r="1.5" fill="#c9d1d9" />
  </g>

  <!-- Wortmarke -->
  <text x="55" y="32" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="22" fill="#c9d1d9">
    Net<tspan fill="#00e5ff">Topology</tspan>
  </text>
  <text x="55" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#8b949e" text-transform="uppercase">
    Live Layer-1 Insight
  </text>
</svg>
